name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The package declares Python >=3.10. Preserve supported release
        # coverage and include the newest version in the locked test matrix.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Install package
        run: pip install dist/*.whl

      - name: Verify installed analyzer wheel
        run: |
          python -I - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from importlib.metadata import version
          import sys
          import code2llm
          assert code2llm.__version__ == version('code2llm')
          from code2llm.core.lang.typescript import analyze_typescript_js
          assert Path(code2llm.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          result = analyze_typescript_js('let pending=null; const pick=()=>true;', 'fixture.js', 'fixture', '.js', defaultdict(int))
          assert set(result['functions']) == {'fixture.pick'}
          assert result['functions']['fixture.pick'].complexity['cyclomatic_complexity'] == 1
          PY
      
      - name: Run tests
        run: |
          pip install pytest pytest-cov pytest-xdist
          pytest tests/ -q -n 2 --tb=short

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/code2llm
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
