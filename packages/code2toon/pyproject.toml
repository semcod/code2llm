[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code2toon"
version = "0.1.0"
description = "TOON (Topology Oriented Object Notation) parser, validator, and schema engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Tom Sapletta", email = "tom@sapletta.com"}
]
keywords = ["toon", "code-analysis", "static-analysis", "architecture", "topology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code2toon*"]
